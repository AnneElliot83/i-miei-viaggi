<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Miei Viaggi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fdfcfa">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="search-index.js"></script>
<style>
  :root{
    --bg:#faf8f2;
    --bg-panel:#ffffff;
    --line:#e3ddd0;
    --text:#20232a;
    --text-soft:#5c6069;
    --grecia:#6b7a2f;
    --regno-unito:#5c4d8a;
    --francia:#7d2f4a;
    --italia:#8a5a1f;
    --vaticano:#b3901f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Public Sans', sans-serif;
    font-size:18px;
    line-height:1.55;
  }
  header{
    padding:52px 24px 30px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:2.5rem;
    margin:0 0 6px;
    color:#1f2318;
    letter-spacing:0.01em;
  }
  header p{
    margin:0;
    color:var(--text-soft);
    font-style:italic;
    font-size:1rem;
  }
  .search-wrap{
    max-width:600px;
    margin:26px auto 0;
    padding:0 20px;
  }
  #search{
    width:100%;
    padding:14px 18px;
    font-family:'Public Sans', sans-serif;
    font-size:1rem;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg-panel);
    color:var(--text);
    outline:none;
  }
  #search:focus{border-color:#c9c3b8;}
  main{
    max-width:940px;
    margin:0 auto;
    padding:32px 24px 80px;
  }
  .project{
    margin-bottom:14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--bg-panel);
    overflow:hidden;
  }
  .project-title{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 18px;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
  }
  .flag{
    font-size:1.3rem;
    line-height:1;
  }
  .project-title .name{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:1.4rem;
    color:#1f2318;
  }
  .project-title .count{
    margin-left:auto;
    font-size:0.85rem;
    font-style:italic;
    color:var(--text-soft);
  }
  .project-title .proj-chev{
    color:var(--text-soft);
    font-size:1.3rem;
    transition:transform 0.2s ease;
    flex-shrink:0;
  }
  .project.open .proj-chev{ transform:rotate(90deg); }
  .project-body{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.3s ease;
  }
  .project.open .project-body{ max-height:20000px; }
  .project-body-inner{
    padding:0 18px 20px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  .subsection{
    margin-bottom:20px;
  }
  .subsection:last-child{
    margin-bottom:0;
  }
  .subsection-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:1.1rem;
    color:var(--text);
    margin-bottom:10px;
  }
  .subsection-title .flag-small{
    font-size:1rem;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
    gap:10px;
  }
  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    cursor:pointer;
    transition:border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover{
    transform:translateY(-1px);
    border-color:#d8d2c5;
  }
  .card.not-ready{
    cursor:default;
    opacity:0.55;
  }
  .card.not-ready:hover{
    transform:none;
    border-color:var(--line);
  }
  .card .soon{
    font-size:0.68rem;
    font-style:italic;
    color:var(--text-soft);
    margin-top:3px;
  }
  .card .eyebrow{
    font-family:'Public Sans', sans-serif;
    font-weight:600;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-soft);
    margin-bottom:4px;
  }
  .card .name{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:1.15rem;
    color:#1f2318;
  }
  .card .greek{
    font-style:italic;
    font-size:0.8rem;
    color:var(--text-soft);
    margin-top:2px;
  }
  .proj-grecia .card{ border-left:3px solid var(--grecia); }
  .proj-regno-unito .card{ border-left:3px solid var(--regno-unito); }
  .proj-francia .card{ border-left:3px solid var(--francia); }
  .proj-italia .card{ border-left:3px solid var(--italia); }
  .proj-vaticano .card{ border-left:3px solid var(--vaticano); }

  .no-results{
    text-align:center;
    font-style:italic;
    color:var(--text-soft);
    padding:40px 0;
  }
  .deep-results{
    margin-top:14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--bg-panel);
    padding:16px 18px 18px;
  }
  .deep-results-title{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:1.1rem;
    color:var(--text);
    margin-bottom:4px;
  }
  .deep-results-sub{
    font-size:0.82rem;
    color:var(--text-soft);
    margin-bottom:12px;
  }
  .deep-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .deep-chip{
    display:block;
    text-decoration:none;
    color:var(--text);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    font-size:0.9rem;
  }
  .deep-chip:hover{ border-color:#c9c3b8; }
  .deep-chip .deep-context{
    display:block;
    font-size:0.72rem;
    color:var(--text-soft);
    margin-top:1px;
  }
</style>
</head>
<body>

<header>
  <h1>I Miei Viaggi</h1>
  <p>Itinerari, storia, arte, mitologia — tutto in un posto</p>
</header>

<div class="search-wrap">
  <input type="text" id="search" placeholder="Cerca: es. Acropoli, Meteora, Edimburgo...">
</div>

<main id="main"></main>

<script>
// Ogni "project" è una nazione/macro-area.
// Se un project ha "subsections", i contenuti sono raggruppati sotto ciascuna regione.
// Se un project ha "items" diretti (come Grecia), restano semplici.
const data = [
  {
    project: "Grecia",
    flag: "🇬🇷",
    key: "grecia",
    items: [
      {name:"Itinerario", greek:"", eyebrow:"Panoramica", file:"itinerario-grecia.html"},
      {name:"Storia della Grecia Antica", greek:"", eyebrow:"Storia", file:"storia-grecia.html"},
      {name:"Arte Greca", greek:"", eyebrow:"Arte", file:"arte-grecia.html"},
      {name:"Mitologia Greca", greek:"Μῦθος", eyebrow:"Compendio", file:"mitologia.html"},
      {name:"Personaggi Storici Greci", greek:"Ἱστορία", eyebrow:"Compendio", file:"personaggi.html"},
      {name:"Meteora", greek:"", eyebrow:"Guida città", file:"meteora.html"},
      {name:"Delfi", greek:"Δελφοί", eyebrow:"Guida città", file:"delfi.html"},
      {name:"Atene", greek:"Ἀθῆναι", eyebrow:"Guida città", file:"atene.html"},
      {name:"Corinto", greek:"Κόρινθος", eyebrow:"Guida città", file:"corinto.html"},
      {name:"Micene", greek:"Μυκῆναι", eyebrow:"Guida città", file:"micene.html"},
      {name:"Tirinto", greek:"Τίρυνς", eyebrow:"Guida città", file:"tirinto.html"},
      {name:"Argo", greek:"Ἄργος", eyebrow:"Guida città", file:"argo.html"},
      {name:"Epidauro", greek:"Ἐπίδαυρος", eyebrow:"Guida città", file:"epidauro.html"},
      {name:"Nauplia", greek:"Ναύπλιον", eyebrow:"Guida città", file:"nauplia.html"},
      {name:"Sparta", greek:"Σπάρτη", eyebrow:"Guida città", file:"sparta.html"},
      {name:"Mistrà", greek:"Μυστρᾶς", eyebrow:"Guida città", file:"mistra.html"},
      {name:"Olimpia", greek:"Ὀλυμπία", eyebrow:"Guida città", file:"olimpia.html"},
    ]
  },
  {
    project: "Regno Unito",
    flag: "🇬🇧",
    key: "regno-unito",
    subsections: [
      {
        name: "Scozia",
        flag: "svg:scozia",
        items: [
          {name:"Itinerario", greek:"", eyebrow:"Panoramica"},
          {name:"Storia e Geografia", greek:"", eyebrow:"Panoramica", file:"scozia-generale.html"},
          {name:"Edimburgo", greek:"", eyebrow:"Guida città", file:"edimburgo-scozia.html"},
          {name:"Stirling", greek:"", eyebrow:"Guida città", file:"stirling.html"},
          {name:"I Trossachs", greek:"", eyebrow:"Guida regione", file:"trossachs.html"},
          {name:"Scottish Borders", greek:"", eyebrow:"Guida regione", file:"scottish-borders.html"},
          {name:"Cairngorms & Highlands Orientali", greek:"", eyebrow:"Guida regione", file:"cairngorms.html"},
          {name:"Great Glen", greek:"", eyebrow:"Guida regione", file:"great-glen.html"},
          {name:"Highlands Occidentali", greek:"", eyebrow:"Guida regione", file:"highlands-occidentali.html"},
          {name:"Personaggi Scozzesi", greek:"", eyebrow:"Compendio", file:"personaggi-scozia.html"},
          {name:"Cultura e Tradizioni", greek:"", eyebrow:"Compendio", file:"extra-scozia.html"},
        ]
      },
      { name: "Inghilterra", flag: "", items: [] },
      { name: "Galles", flag: "", items: [] },
    ]
  },
  {
    project: "Francia",
    flag: "🇫🇷",
    key: "francia",
    subsections: [
      {
        name: "Borgogna",
        flag: "",
        items: [
          {name:"Itinerario", greek:"", eyebrow:"Panoramica", file:"itinerario-borgogna.html"},
          {name:"Luoghi e Monumenti", greek:"", eyebrow:"Guida", file:"borgogna.html"},
          {name:"La Borgogna in sette epoche", greek:"", eyebrow:"Approfondimento", file:"borgogna-storia.html"},
          {name:"Cluny e Cîteaux", greek:"", eyebrow:"Approfondimento", file:"borgogna-cluny-citeaux.html"},
          {name:"Il romanico borgognone", greek:"", eyebrow:"Approfondimento", file:"borgogna-romanico.html"},
          {name:"I Climats di Borgogna", greek:"", eyebrow:"Approfondimento", file:"borgogna-climats.html"},
        ]
      },
      { name: "Normandia", flag: "", items: [] },
      { name: "Île-de-France", flag: "", items: [] },
      { name: "Loira", flag: "", items: [] },
      { name: "Provenza", flag: "", items: [] },
      { name: "Bretagna", flag: "", items: [] },
    ]
  },
  {
    project: "Italia",
    flag: "🇮🇹",
    key: "italia",
    subsections: [
      { name: "Abruzzo", flag: "", items: [] },
      { name: "Basilicata", flag: "", items: [] },
      { name: "Calabria", flag: "", items: [] },
      {
        name: "Campania",
        flag: "",
        items: [
          {name:"Napoli", greek:"", eyebrow:"Guida città"},
          {name:"Pompei", greek:"", eyebrow:"Guida città"},
          {name:"Ercolano", greek:"", eyebrow:"Guida città"},
        ]
      },
      { name: "Emilia-Romagna", flag: "", items: [] },
      { name: "Friuli-Venezia Giulia", flag: "", items: [] },
      {
        name: "Lazio",
        flag: "",
        items: [
          {name:"Roma", greek:"", eyebrow:"Guida città", file:"roma.html"},
        ]
      },
      {
        name: "Liguria",
        flag: "",
        items: [
          {name:"Genova", greek:"", eyebrow:"Guida città", file:"genova.html"},
        ]
      },
      {
        name: "Lombardia",
        flag: "",
        items: [
          {name:"Brescia", greek:"", eyebrow:"Guida città", file:"brescia.html"},
        ]
      },
      { name: "Marche", flag: "", items: [] },
      { name: "Molise", flag: "", items: [] },
      { name: "Piemonte", flag: "", items: [] },
      { name: "Puglia", flag: "", items: [] },
      { name: "Sardegna", flag: "", items: [] },
      { name: "Sicilia", flag: "", items: [] },
      { name: "Toscana", flag: "", items: [] },
      { name: "Trentino-Alto Adige", flag: "", items: [] },
      { name: "Umbria", flag: "", items: [] },
      { name: "Valle d'Aosta", flag: "", items: [] },
      { name: "Veneto", flag: "", items: [] },
    ]
  },
  {
    project: "Città del Vaticano",
    flag: "🇻🇦",
    key: "vaticano",
    items: [
      {name:"Storia di San Pietro", greek:"", eyebrow:"Storia", file:"san-pietro-storia.html"},
      {name:"Personaggi di San Pietro", greek:"", eyebrow:"Compendio", file:"vaticano-personaggi.html"},
      {name:"Approfondimenti", greek:"", eyebrow:"Compendio", file:"vaticano-approfondimenti.html"},
                                                                                              ]
  }
];

const main = document.getElementById('main');
const searchInput = document.getElementById('search');

// Nazioni aperte manualmente (tap sull'intestazione). Vuoto = tutte chiuse di default.
const manuallyOpen = new Set();

// Ricerca "a parole": ogni parola digitata deve trovarsi da qualche parte
// (nome, sottotitolo greco, etichetta, sottosezione, nazione) — in qualsiasi ordine.
function buildSearchText(it, proj, sub){
  return [it.name, it.greek, it.eyebrow, proj.project, sub ? sub.name : '']
    .join(' ').toLowerCase();
}
function itemMatches(it, proj, sub, tokens){
  if (tokens.length === 0) return true;
  const text = buildSearchText(it, proj, sub);
  return tokens.every(tok => text.includes(tok));
}

function buildCards(items){
  const cardsWrap = document.createElement('div');
  cardsWrap.className = 'cards';
  items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'card' + (it.file ? '' : ' not-ready');
    card.innerHTML = `
      <div class="eyebrow">${it.eyebrow}</div>
      <div class="name">${it.name}</div>
      ${it.greek ? `<div class="greek">${it.greek}</div>` : ''}
      ${it.file ? '' : '<div class="soon">contenuto in arrivo</div>'}
    `;
    if (it.file){
      card.addEventListener('click', () => { window.location.href = it.file; });
    }
    cardsWrap.appendChild(card);
  });
  return cardsWrap;
}

function flagHtmlFor(sub){
  if (sub.flag === 'svg:scozia'){
    return `<svg width="18" height="14" viewBox="0 0 18 14" style="flex-shrink:0;"><rect width="18" height="14" fill="#0065bf"/><path d="M0,0 L18,14 M18,0 L0,14" stroke="white" stroke-width="2.4"/></svg>`;
  }
  return sub.flag ? `<span class="flag-small">${sub.flag}</span>` : '';
}

function render(filter=""){
  main.innerHTML = "";
  const tokens = filter.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const searching = tokens.length > 0;
  let anyVisible = false;

  // Nomi già mostrati tra le card normali, per non ripeterli nei "risultati nei contenuti"
  const shownNames = new Set();

  data.forEach(proj => {
    const section = document.createElement('div');
    section.className = 'project proj-' + proj.key;
    let sectionHasContent = false;
    let projCount = 0;

    const bodyInner = document.createElement('div');
    bodyInner.className = 'project-body-inner';

    if (proj.items){
      const matching = proj.items.filter(it => itemMatches(it, proj, null, tokens));
      if (matching.length > 0){
        sectionHasContent = true;
        projCount += matching.length;
        matching.forEach(it => shownNames.add(it.name.toLowerCase()));
        bodyInner.appendChild(buildCards(matching));
      }
    }

    if (proj.subsections){
      proj.subsections.forEach(sub => {
        const matching = sub.items.filter(it => itemMatches(it, proj, sub, tokens));
        if (matching.length === 0) return;
        sectionHasContent = true;
        projCount += matching.length;
        matching.forEach(it => shownNames.add(it.name.toLowerCase()));

        const subDiv = document.createElement('div');
        subDiv.className = 'subsection';
        const subTitle = document.createElement('div');
        subTitle.className = 'subsection-title';
        subTitle.innerHTML = `${flagHtmlFor(sub)}${sub.name}`;
        subDiv.appendChild(subTitle);
        subDiv.appendChild(buildCards(matching));
        bodyInner.appendChild(subDiv);
      });
    }

    if (sectionHasContent){
      const isOpen = searching ? true : manuallyOpen.has(proj.key);
      section.classList.toggle('open', isOpen);

      const title = document.createElement('div');
      title.className = 'project-title';
      title.innerHTML = `<span class="flag">${proj.flag}</span><span class="name">${proj.project}</span><span class="count">${projCount} contenut${projCount===1?'o':'i'}</span><span class="proj-chev">›</span>`;
      title.addEventListener('click', () => {
        if (manuallyOpen.has(proj.key)) manuallyOpen.delete(proj.key);
        else manuallyOpen.add(proj.key);
        render(searchInput.value);
      });
      section.appendChild(title);

      const body = document.createElement('div');
      body.className = 'project-body';
      body.appendChild(bodyInner);
      section.appendChild(body);

      main.appendChild(section);
      anyVisible = true;
    }
  });

  // Risultati dall'indice profondo (singoli luoghi/voci dentro le pagine)
  if (searching && typeof deepIndex !== 'undefined'){
    const deepMatches = deepIndex.filter(d => {
      if (shownNames.has(d.name.toLowerCase())) return false;
      const text = (d.name + ' ' + d.context).toLowerCase();
      return tokens.every(tok => text.includes(tok));
    });
    if (deepMatches.length > 0){
      anyVisible = true;
      const wrap = document.createElement('div');
      wrap.className = 'deep-results';
      wrap.innerHTML = `
        <div class="deep-results-title">Trovato dentro le pagine</div>
        <div class="deep-results-sub">${deepMatches.length} voc${deepMatches.length===1?'e':'i'} — tocca per aprire direttamente nel punto giusto</div>
      `;
      const list = document.createElement('div');
      list.className = 'deep-list';
      deepMatches.slice(0, 40).forEach(d => {
        const a = document.createElement('a');
        a.className = 'deep-chip';
        a.href = d.id ? `${d.file}#${d.id}` : d.file;
        a.innerHTML = `${d.name}<span class="deep-context">${d.context}</span>`;
        list.appendChild(a);
      });
      wrap.appendChild(list);
      main.appendChild(wrap);
    }
  }

  if (!anyVisible){
    main.innerHTML = `<div class="no-results">Nessun risultato per «${filter}»</div>`;
  }
}

searchInput.addEventListener('input', e => render(e.target.value));
render();

// Attiva il funzionamento offline (service worker)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
