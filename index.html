<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Miei Viaggi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fdfcfa">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfcfa;
    --bg-panel:#ffffff;
    --line:#eae7e0;
    --text:#565048;
    --text-soft:#8c8579;
    --grecia:#8a9a8b;
    --regno-unito:#8a95a8;
    --francia:#b09a7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'EB Garamond', serif;
    font-size:18px;
    line-height:1.55;
  }
  header{
    padding:52px 24px 30px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:2.5rem;
    margin:0 0 6px;
    color:#3d3830;
    letter-spacing:0.01em;
  }
  header p{
    margin:0;
    color:var(--text-soft);
    font-style:italic;
    font-size:1rem;
  }
  .search-wrap{
    max-width:600px;
    margin:26px auto 0;
    padding:0 20px;
  }
  #search{
    width:100%;
    padding:14px 18px;
    font-family:'EB Garamond', serif;
    font-size:1.1rem;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg-panel);
    color:var(--text);
    outline:none;
  }
  #search:focus{border-color:#c9c3b8;}
  main{
    max-width:940px;
    margin:0 auto;
    padding:44px 24px 80px;
  }
  .project{
    margin-bottom:44px;
  }
  .project-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .flag{
    font-size:1.3rem;
    line-height:1;
  }
  .project-title .name{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.5rem;
    color:#3d3830;
  }
  .project-title .count{
    margin-left:auto;
    font-size:0.85rem;
    font-style:italic;
    color:var(--text-soft);
  }
  .subsection{
    margin-bottom:20px;
    margin-left:8px;
  }
  .subsection:last-child{
    margin-bottom:0;
  }
  .subsection-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.1rem;
    color:var(--text);
    margin-bottom:10px;
  }
  .subsection-title .flag-small{
    font-size:1rem;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
    gap:10px;
  }
  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    cursor:pointer;
    transition:border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover{
    transform:translateY(-1px);
    border-color:#d8d2c5;
  }
  .card.not-ready{
    cursor:default;
    opacity:0.55;
  }
  .card.not-ready:hover{
    transform:none;
    border-color:var(--line);
  }
  .card .soon{
    font-size:0.68rem;
    font-style:italic;
    color:var(--text-soft);
    margin-top:3px;
  }
  .card .eyebrow{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.07em;
    color:var(--text-soft);
    margin-bottom:4px;
  }
  .card .name{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.15rem;
    color:#3d3830;
  }
  .card .greek{
    font-style:italic;
    font-size:0.8rem;
    color:var(--text-soft);
    margin-top:2px;
  }
  .proj-grecia .card{ border-left:3px solid var(--grecia); }
  .proj-regno-unito .card{ border-left:3px solid var(--regno-unito); }
  .proj-francia .card{ border-left:3px solid var(--francia); }

  .no-results{
    text-align:center;
    font-style:italic;
    color:var(--text-soft);
    padding:40px 0;
  }
  .note{
    max-width:940px;
    margin:0 auto;
    padding:0 24px;
    text-align:center;
    color:var(--text-soft);
    font-style:italic;
    font-size:0.9rem;
  }
</style>
</head>
<body>

<header>
  <h1>I Miei Viaggi</h1>
  <p>Itinerari, storia, arte, mitologia — tutto in un posto</p>
</header>

<div class="search-wrap">
  <input type="text" id="search" placeholder="Cerca: es. Acropoli, Meteora, Edimburgo...">
</div>

<p class="note" style="margin-top:14px;">Versione 3 — con sottosezioni (Regno Unito › Scozia, Francia › Borgogna)</p>

<main id="main"></main>

<script>
// Ogni "project" è una nazione/macro-area.
// Se un project ha "subsections", i contenuti sono raggruppati sotto ciascuna regione.
// Se un project ha "items" diretti (come Grecia per ora), restano semplici.
const data = [
  {
    project: "Grecia",
    flag: "🇬🇷",
    key: "grecia",
    items: [
      {name:"Itinerario", greek:"", eyebrow:"Panoramica"},
      {name:"Storia della Grecia Antica", greek:"", eyebrow:"Storia"},
      {name:"Arte e Architettura", greek:"", eyebrow:"Arte"},
      {name:"Meteora", greek:"", eyebrow:"Guida città"},
      {name:"Delfi", greek:"Δελφοί", eyebrow:"Guida città", file:"delfi.html"},
      {name:"Atene", greek:"Ἀθῆναι", eyebrow:"Guida città", file:"atene.html"},
      {name:"Corinto", greek:"Κόρινθος", eyebrow:"Guida città", file:"corinto.html"},
      {name:"Micene", greek:"Μυκῆναι", eyebrow:"Guida città", file:"micene.html"},
      {name:"Tirinto", greek:"Τίρυνς", eyebrow:"Guida città", file:"tirinto.html"},
      {name:"Argo", greek:"Ἄργος", eyebrow:"Guida città", file:"argo.html"},
      {name:"Epidauro", greek:"Ἐπίδαυρος", eyebrow:"Guida città"},
      {name:"Nauplia", greek:"Ναύπλιον", eyebrow:"Guida città", file:"nauplia.html"},
      {name:"Sparta", greek:"Σπάρτη", eyebrow:"Guida città", file:"sparta.html"},
      {name:"Mistrà", greek:"Μυστρᾶς", eyebrow:"Guida città", file:"mistra.html"},
      {name:"Olimpia", greek:"Ὀλυμπία", eyebrow:"Guida città", file:"olimpia.html"},
    ]
    // Nota: qui in futuro suddivideremo per regione (Attica, Peloponneso, Grecia centrale...)
  },
  {
    project: "Regno Unito",
    flag: "🇬🇧",
    key: "regno-unito",
    subsections: [
      {
        name: "Scozia",
        flag: "svg:scozia",
        items: [
          {name:"Itinerario", greek:"", eyebrow:"Panoramica"},
          {name:"Edimburgo", greek:"", eyebrow:"Guida città"},
          {name:"Highlands", greek:"", eyebrow:"Guida regione"},
        ]
      }
    ]
  },
  {
    project: "Francia",
    flag: "🇫🇷",
    key: "francia",
    subsections: [
      {
        name: "Borgogna",
        flag: "",
        items: [
          {name:"Itinerario", greek:"", eyebrow:"Panoramica"},
        ]
      }
    ]
  }
];

const main = document.getElementById('main');
const searchInput = document.getElementById('search');

function itemMatches(it, proj, sub, f){
  return it.name.toLowerCase().includes(f) ||
         it.eyebrow.toLowerCase().includes(f) ||
         proj.project.toLowerCase().includes(f) ||
         (sub && sub.name.toLowerCase().includes(f));
}

function buildCards(items){
  const cardsWrap = document.createElement('div');
  cardsWrap.className = 'cards';
  items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'card' + (it.file ? '' : ' not-ready');
    card.innerHTML = `
      <div class="eyebrow">${it.eyebrow}</div>
      <div class="name">${it.name}</div>
      ${it.greek ? `<div class="greek">${it.greek}</div>` : ''}
      ${it.file ? '' : '<div class="soon">contenuto in arrivo</div>'}
    `;
    if (it.file){
      card.addEventListener('click', () => { window.location.href = it.file; });
    }
    cardsWrap.appendChild(card);
  });
  return cardsWrap;
}

function render(filter=""){
  main.innerHTML = "";
  const f = filter.trim().toLowerCase();
  let anyVisible = false;
  let totalCount = 0;

  data.forEach(proj => {
    const section = document.createElement('div');
    section.className = 'project proj-' + proj.key;
    let sectionHasContent = false;
    let projCount = 0;

    const title = document.createElement('div');
    title.className = 'project-title';
    section.appendChild(title);

    if (proj.items){
      const matching = proj.items.filter(it => itemMatches(it, proj, null, f));
      if (matching.length > 0){
        sectionHasContent = true;
        projCount += matching.length;
        section.appendChild(buildCards(matching));
      }
    }

    if (proj.subsections){
      proj.subsections.forEach(sub => {
        const matching = sub.items.filter(it => itemMatches(it, proj, sub, f));
        if (matching.length === 0) return;
        sectionHasContent = true;
        projCount += matching.length;

        const subDiv = document.createElement('div');
        subDiv.className = 'subsection';
        const subTitle = document.createElement('div');
        subTitle.className = 'subsection-title';
        const flagHtml = sub.flag === 'svg:scozia'
          ? `<svg width="18" height="14" viewBox="0 0 18 14" style="flex-shrink:0;"><rect width="18" height="14" fill="#0065bf"/><path d="M0,0 L18,14 M18,0 L0,14" stroke="white" stroke-width="2.4"/></svg>`
          : (sub.flag ? `<span class="flag-small">${sub.flag}</span>` : '');
        subTitle.innerHTML = `${flagHtml}${sub.name}`;
        subDiv.appendChild(subTitle);
        subDiv.appendChild(buildCards(matching));
        section.appendChild(subDiv);
      });
    }

    if (sectionHasContent){
      title.innerHTML = `<span class="flag">${proj.flag}</span><span class="name">${proj.project}</span><span class="count">${projCount} contenut${projCount===1?'o':'i'}</span>`;
      main.appendChild(section);
      anyVisible = true;
      totalCount += projCount;
    }
  });

  if (!anyVisible){
    main.innerHTML = `<div class="no-results">Nessun risultato per «${filter}»</div>`;
  }
}

searchInput.addEventListener('input', e => render(e.target.value));
render();

// Attiva il funzionamento offline (service worker)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
